[project]
name = "sih"
version = "0.1.0"
description = "SIH — Something Is Happening : détection de changements de comportement sur Internet"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "feedparser>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "tweepy>=4.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sih*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
